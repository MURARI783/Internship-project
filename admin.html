<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAHRUDAYA - Admin Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f7fb;
      --muted: #a0aec0;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d1117;
      color: var(--text);
      font-family: 'Poppins', system-ui, sans-serif;
      line-height: 1.6;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #ffffff;
    }

    .back-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover {
      background: #2563eb;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .stat-card h3 {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat-card .number {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 0.5rem;
    }

    .messages-container {
      display: grid;
      gap: 1.5rem;
    }

    .message-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(18px);
    }

    .message-card h3 {
      margin: 0 0 0.5rem;
      color: #ffffff;
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .message-meta span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .message-content {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--accent);
      padding: 1rem;
      border-radius: 6px;
      color: #e0e0e0;
      line-height: 1.6;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state h2 {
      font-size: 1.5rem;
      margin: 1rem 0 0.5rem;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📬 Contact Messages</h1>
      <a href="/" class="back-btn">← Back to Site</a>
    </header>

    <div class="stats">
      <div class="stat-card">
        <h3>Total Messages</h3>
        <div class="number" id="total-count">0</div>
      </div>
    </div>

    <div id="loading" class="loading">
      <p>Loading messages...</p>
    </div>

    <div id="messages" class="messages-container" style="display: none;"></div>

    <div id="empty" class="empty-state" style="display: none;">
      <p>📭 No messages yet</p>
      <h2>Check back later!</h2>
    </div>
  </div>

  <script>
    async function loadMessages() {
      try {
        const response = await fetch('/api/contacts');
        const messages = await response.json();

        const loadingEl = document.getElementById('loading');
        const messagesEl = document.getElementById('messages');
        const emptyEl = document.getElementById('empty');
        const totalEl = document.getElementById('total-count');

        loadingEl.style.display = 'none';

        if (messages.length === 0) {
          emptyEl.style.display = 'block';
          totalEl.textContent = '0';
          return;
        }

        totalEl.textContent = messages.length;
        messagesEl.style.display = 'grid';

        messagesEl.innerHTML = messages
          .map((msg) => {
            const date = new Date(msg.createdAt);
            const formattedDate = date.toLocaleDateString();
            const formattedTime = date.toLocaleTimeString();

            return `
              <div class="message-card">
                <h3>${escapeHtml(msg.name)}</h3>
                <div class="message-meta">
                  <span>📧 ${escapeHtml(msg.email)}</span>
                  <span>📅 ${formattedDate}</span>
                  <span>🕐 ${formattedTime}</span>
                </div>
                <div class="message-content">
                  ${escapeHtml(msg.message).replace(/\n/g, '<br>')}
                </div>
              </div>
            `;
          })
          .join('');
      } catch (error) {
        console.error('Error loading messages:', error);
        document.getElementById('loading').innerHTML = '<p>❌ Error loading messages</p>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadMessages();
  </script>
</body>
</html>
